project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll
    - images/author/Bayu.jpg
    - epub-reader.html
    - assets/epub-reader.js

book:
  title: "Introduction to Statistics (SDT-11012)"
  output-file: Quarto-Template
  author: "Bayu Fachri (52260027)"
  date: today
  description: "Deskripsi singkat tentang buku"
  cover-image: images/Cover.png
  repo-url: https://github.com/pakardata1/ebook-template-quarto.git
  repo-actions: [edit, issue]
  sidebar:
    tools:
      - icon: file-pdf
        href: Quarto-Template.pdf
        text: Pratinjau PDF
        aria-label: Pratinjau PDF
      - icon: journal
        href: epub-reader.html
        text: Pratinjau EPUB
        aria-label: Pratinjau EPUB
  chapters:
    - index.qmd
    - chapters/P01.qmd
    - chapters/P02.qmd
    - chapters/P03.qmd
    - chapters/P04.qmd
    - chapters/P05.qmd
    - "chapters/P08 UTS.qmd"
    - chapters/P09.qmd
    - chapters/P10.qmd
    - chapters/P11.qmd
    - chapters/P12.qmd
    - chapters/P13.qmd
    - chapters/P14.qmd
    - chapters/P15.qmd
    - "chapters/P16 UAS.qmd"
    - references/referensi.qmd

bibliography:
  - references/book.bib
  - references/packages.bib
csl: references/ieee.csl
link-citations: true

knitr:
  opts_chunk:
    screenshot.force: false
  opts_knit:
    rmarkdown.pandoc.to: "latex"

format:
  html:
    theme: cosmo
    css: assets/style.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true
    include-after-body: assets/hover-preview.html
    include-in-header:
      text: |
        <meta name="author" content="Bayu Fachri">
  pdf:
    documentclass: book
    pdf-engine: xelatex
    keep-tex: true
    include-in-header: assets/preamble.tex
    number-sections: true
    toc: true
    prefer-html: true
  epub:
    cover-image: images/Cover.png
    prefer-html: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

lang: id
